<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bildgenerator</title>
<meta name="theme-color" content="#0f0f16" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.json" />
<style>
:root {
  --bg: #0f0f16;
  --bg-alt: #17171f;
  --card: #1b1b26;
  --border: #2c2c3a;
  --text: #f2f2f7;
  --text-dim: #9a9aab;
  --accent: #7c5cff;
  --accent-2: #ff6bd6;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 16px) + 16px);
  max-width: 560px;
  margin: 0 auto;
  gap: 16px;
  background: radial-gradient(circle at 20% 0%, rgba(124, 92, 255, 0.25), transparent 55%),
    radial-gradient(circle at 100% 10%, rgba(255, 107, 214, 0.18), transparent 50%);
}

.header {
  text-align: center;
  padding: 12px 0 4px;
}

.header h1 {
  margin: 0;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.subtitle {
  margin: 6px 0 0;
  color: var(--text-dim);
  font-size: 0.92rem;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

textarea {
  width: 100%;
  resize: vertical;
  min-height: 80px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  padding: 12px 14px;
  font-size: 1rem;
  font-family: inherit;
  line-height: 1.4;
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  border: 1px solid var(--border);
  background: var(--bg-alt);
  color: var(--text-dim);
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 0.85rem;
  cursor: pointer;
}

.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.btn {
  flex: 1 1 auto;
  min-height: 48px;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  padding: 0 16px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border: none;
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-ghost {
  background: var(--bg-alt);
  color: var(--text);
}

.status {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-dim);
  font-size: 0.9rem;
}

.status.error {
  color: #ff8080;
}

.spinner {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.result {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.image-wrap {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.footer {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.75rem;
  padding: 4px 0 8px;
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>Bildgenerator</h1>
    <p class="subtitle">Beschreibe ein Bild &ndash; wir erstellen es für dich</p>
  </header>

  <main class="card">
    <textarea
      id="prompt"
      placeholder="z. B. Ein Leuchtturm bei Sonnenuntergang, Wellen brechen an Felsen"
      rows="3"
      maxlength="500"
    ></textarea>

    <div class="chips" id="styleChips">
      <button type="button" class="chip" data-style="">Kein Stil</button>
      <button type="button" class="chip" data-style="photorealistic, highly detailed, 8k">Foto</button>
      <button type="button" class="chip" data-style="anime style, vibrant colors">Anime</button>
      <button type="button" class="chip" data-style="watercolor painting, soft brush strokes">Aquarell</button>
      <button type="button" class="chip" data-style="oil painting, classical art style">Ölgemälde</button>
      <button type="button" class="chip" data-style="3d render, octane render, cinematic lighting">3D-Render</button>
      <button type="button" class="chip" data-style="pixel art, retro video game style">Pixel-Art</button>
    </div>

    <div class="actions">
      <button type="button" id="generateBtn" class="btn btn-primary">Bild erstellen</button>
      <button type="button" id="surpriseBtn" class="btn btn-ghost">Überrasch mich</button>
    </div>

    <div id="status" class="status" hidden></div>

    <section id="result" class="result" hidden>
      <div class="image-wrap">
        <img id="resultImage" alt="Generiertes Bild" />
      </div>
      <div class="actions">
        <button type="button" id="regenerateBtn" class="btn btn-ghost">Neue Variante</button>
        <button type="button" id="downloadBtn" class="btn btn-ghost">Herunterladen</button>
        <button type="button" id="shareBtn" class="btn btn-ghost" hidden>Teilen</button>
      </div>
    </section>
  </main>

  <footer class="footer">Bilder werden über image.pollinations.ai erzeugt.</footer>
</div>

<script>
const promptEl = document.getElementById("prompt");
const styleChipsEl = document.getElementById("styleChips");
const generateBtn = document.getElementById("generateBtn");
const surpriseBtn = document.getElementById("surpriseBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const resultImage = document.getElementById("resultImage");
const regenerateBtn = document.getElementById("regenerateBtn");
const downloadBtn = document.getElementById("downloadBtn");
const shareBtn = document.getElementById("shareBtn");

const EXAMPLE_PROMPTS = [
  "Ein Leuchtturm bei Sonnenuntergang, Wellen brechen an Felsen",
  "Eine futuristische Stadt bei Nacht mit fliegenden Autos",
  "Ein Astronaut reitet auf einem Pferd auf dem Mond",
  "Eine gemütliche Kaffeebar in einem verwunschenen Wald",
  "Ein Drache schläft auf einem Berg aus Gold",
  "Ein Katzen-Astronaut schwebt zwischen den Sternen",
  "Ein verlassenes Schloss im Nebel, mystische Stimmung",
  "Ein Roboter gärtnert in einem Zukunftsgarten",
];

let selectedStyle = "";
let currentBasePrompt = "";

styleChipsEl.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  styleChipsEl.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
  chip.classList.add("active");
  selectedStyle = chip.dataset.style;
});

generateBtn.addEventListener("click", () => {
  const text = promptEl.value.trim();
  if (!text) {
    showStatus("Bitte gib zuerst eine Beschreibung ein.", true);
    return;
  }
  generateImage(text);
});

surpriseBtn.addEventListener("click", () => {
  const random = EXAMPLE_PROMPTS[Math.floor(Math.random() * EXAMPLE_PROMPTS.length)];
  promptEl.value = random;
  generateImage(random);
});

regenerateBtn.addEventListener("click", () => {
  if (currentBasePrompt) generateImage(currentBasePrompt);
});

downloadBtn.addEventListener("click", () => {
  downloadImage(resultImage.src);
});

if (navigator.share) {
  shareBtn.hidden = false;
  shareBtn.addEventListener("click", async () => {
    try {
      const res = await fetch(resultImage.src);
      const blob = await res.blob();
      const file = new File([blob], "bild.jpg", { type: blob.type || "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Mein generiertes Bild" });
      } else {
        await navigator.share({ url: resultImage.src, title: "Mein generiertes Bild" });
      }
    } catch (err) {
      // user cancelled or share failed silently
    }
  });
}

function buildFullPrompt(basePrompt) {
  return selectedStyle ? `${basePrompt}, ${selectedStyle}` : basePrompt;
}

function showStatus(text, isError = false) {
  statusEl.hidden = false;
  statusEl.classList.toggle("error", isError);
  statusEl.innerHTML = isError ? "" : '<span class="spinner"></span>';
  statusEl.append(text);
}

function hideStatus() {
  statusEl.hidden = true;
}

function generateImage(basePrompt) {
  currentBasePrompt = basePrompt;
  const fullPrompt = buildFullPrompt(basePrompt);
  const seed = Math.floor(Math.random() * 1_000_000);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(
    fullPrompt
  )}?width=1024&height=1024&seed=${seed}&nologo=true`;

  generateBtn.disabled = true;
  resultEl.hidden = true;
  showStatus("Bild wird erstellt...");

  const img = new Image();
  img.onload = () => {
    resultImage.src = url;
    resultEl.hidden = false;
    hideStatus();
    generateBtn.disabled = false;
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  img.onerror = () => {
    showStatus("Bild konnte nicht erstellt werden. Bitte versuch es erneut.", true);
    generateBtn.disabled = false;
  };
  img.src = url;
}

async function downloadImage(url) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const objectUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objectUrl;
    a.download = "bild.jpg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objectUrl);
  } catch (err) {
    window.open(url, "_blank");
  }
}
</script>
</body>
</html>
